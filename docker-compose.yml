#name: state_procurement_system

# Четыре независимых профиля деплоя (Compose profiles). Явно выбирать профилем
# нужно всегда — без флага --profile ни один сервис не поднимется.
#
#   docker compose --profile prod up -d --build
#       Полный промышленный стек: db + adminer + backend (gunicorn) +
#       frontend (собранная статика) + nginx (единая точка входа на 80).
#
#   docker compose --profile backend-dev up -d --build
#       Для backend-разработчика: db + adminer + frontend (чужая разработка,
#       только разворачиваем как есть, не редактируем). Backend запускается
#       локально (IDE/venv), подключаясь к БД на localhost:5460.
#       Если фронтенду нужен другой адрес backend-а, чем http://localhost:8000/api/
#       (значение VITE_API_URL из .env) — пересобрать с FRONTEND_API_URL=...
#
#   docker compose --profile frontend-dev up -d --build
#       Для frontend-разработчика: db + adminer + backend (контейнер).
#       Frontend запускается локально (npm run dev), подключаясь к API на
#       localhost:8000.
#
#   docker compose --profile db-only up -d --build
#       Только db + adminer — и backend, и frontend запускаются локально
#       (IDE/venv + npm run dev), подключаясь к БД на localhost:5460.
#
# nginx поднимается только в prod — в dev-профилях сервисы доступны по своим
# портам напрямую, обратный проксирующий слой не нужен.

services:
  db:
    image: postgres:15
    container_name: db
    profiles: ["prod", "backend-dev", "frontend-dev", "db-only"]
    networks:
      - sps_app_net
    expose:
      - "5432"
    ports:
      - "5460:5432"
    env_file:
      - .env
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_HOST: ${DB_HOST}
      POSTGRES_PORT: ${DB_PORT}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/backups:/var/lib/postgresql/backups

  adminer:
    image: adminer
    container_name: adminer_sps
    profiles: ["prod", "backend-dev", "frontend-dev", "db-only"]
    networks:
      - sps_app_net
    ports:
      - "8099:8080"
    restart: always
    depends_on:
      - db

  backend:
    build: ./backend
    container_name: backend_sps
    profiles: ["prod", "frontend-dev"]
    networks:
      - sps_app_net
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: always
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - DJANGO_STATIC_ROOT=/app/static
      - DJANGO_MEDIA_ROOT=/app/media
    volumes:
      - ./backend/static:/app/static
      - ./backend/media:/app/media
    depends_on:
      - db
    command: >
      sh -c "python manage.py migrate --noinput &&
      gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3"

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        VITE_API_URL: ${FRONTEND_API_URL:-/api/}
    container_name: frontend_sps
    profiles: ["prod", "backend-dev"]
    networks:
      - sps_app_net
    ports:
      - "8090:80"
    restart: always

  nginx:
    image: nginx:alpine
    container_name: nginx_sps
    profiles: ["prod"]
    networks:
      - sps_app_net
    ports:
      - "80:80"
    restart: always
    volumes:
      - ./backend/static:/var/www/static/
      - ./backend/media:/var/www/media/
      - ./nginx:/etc/nginx/conf.d
    depends_on:
      - backend
      - frontend

networks:
  sps_app_net:
    driver: bridge

volumes:
  postgres_data:
