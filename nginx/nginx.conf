upstream frontend {
    # Контейнер frontend в prod-профиле — это nginx, отдающий собранную
    # статику SPA (dist/), слушает порт 80 (см. docker/frontend/Dockerfile).
    server frontend:80;
}

upstream backend {
    # Используем имя сервиса Django из docker-compose
    server backend:8000;
}

server {
    listen 80;

    client_max_body_size 100M; # Укажите нужный вам лимит (например, 20 Мегабайт)

    # Обслуживание статических файлов из указанного пути
    location /staticfiles/ {
        # Путь внутри контейнера Nginx, куда будет примонтирована папка /backend/static
        alias /var/www/static/;
    }

    # Обслуживание медиа-файлов из указанного пути
    location /media/ {
        # Путь внутри контейнера Nginx, куда будет примонтирована папка /backend/media
        alias /var/www/media/;
    }

        # Объединенная группа для Django (API, логин, админка)
    location ~ ^/(api|admin|login|logout)/ {
        proxy_pass http://backend;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;

        # Настройка для CSRF и сессий
        proxy_cookie_path / '/; SameSite=Lax';
        # Strict может иногда мешать редиректам

        # 2026-11-24: синхронизация плана с goszakupki.by может идти несколько минут
        # (см. --timeout 300 у gunicorn в docker-compose.yml) — дефолтный
        # proxy_read_timeout nginx (60s) обрывал бы соединение раньше, чем gunicorn.
        proxy_connect_timeout 310s;
        proxy_send_timeout 310s;
        proxy_read_timeout 310s;
    }

    # Все остальные запросы направляем на React-приложение
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}



